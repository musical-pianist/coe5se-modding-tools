name: Sign release

# Signs each .vsix of a release with Sigstore (keyless, through this workflow's GitHub identity)
# and attaches the .sigstore.json bundles beside them. Runs on each published release, or by hand
# for an older tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign, like v0.1.6
        required: true

permissions: read-all

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the release's .vsix files
        run: gh release download "$TAG" --pattern '*.vsix' --dir assets
      - name: Sign each .vsix
        run: |
          for f in assets/*.vsix; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Attach the signatures
        run: gh release upload "$TAG" assets/*.sigstore.json --clobber
