name: Sign release

# Signs each .vsix or mod zip of a release with Sigstore (keyless, through this workflow's GitHub identity)
# and attaches the .sigstore.json bundles beside them. Runs on each published release, or by hand
# for an older tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign, like v0.1.6
        required: true

permissions: read-all

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download the release's files
        run: |
          for attempt in 1 2 3 4 5 6; do
            gh release download "$TAG" --pattern '*.vsix' --pattern '*.zip' --dir assets --clobber && break
            sleep 10
          done
          ls assets/*
      - name: Sign each file
        run: |
          for f in assets/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Attach the signatures
        run: gh release upload "$TAG" assets/*.sigstore.json --clobber
